<style>
/* Sign-in, setup and progress screen shown before the report renders. */
.vr-shell { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.vr-card { width: min(640px, 100%); display: grid; gap: 16px; padding: clamp(20px, 4vw, 36px); border-radius: 20px; border: 1px solid var(--line-hi);
  background: radial-gradient(500px 260px at 100% 0%, rgba(51,227,160,.16), transparent 70%), radial-gradient(500px 300px at 0% 100%, rgba(77,125,255,.22), transparent 70%), var(--deep); }
.vr-card h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.05; }
.vr-card .lede { color: var(--muted); }
.vr-card a { color: var(--cyan); }
.vr-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.vr-err { padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,122,122,.6); background: rgba(255,122,122,.1); color: #ffd5d5; }
.vr-log { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }
.vr-log:empty { display: none; }
.vr-log li:last-child { color: var(--ink); }
.vr-setup { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.vr-setup dt { color: var(--faint); }
.vr-setup dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.vr-setup code, .vr-card code { font: 500 13px var(--mono); color: var(--green); }
.vr-form { display: grid; gap: 10px; }
.vr-form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.vr-form input { background: var(--void); border: 1px solid var(--line-hi); border-radius: 9px; padding: 8px 12px; color: var(--ink); min-width: 0; }
.vr-banner { position: fixed; z-index: 30; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px));
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px;
  background: var(--panel-hi); border: 1px solid var(--gold); box-shadow: 0 18px 50px rgba(0,0,0,.55); font-size: 14px; }
body:not(.vr-booting) .vr-shell { display: none; }
@media (max-width: 560px) { .vr-setup { grid-template-columns: minmax(0, 1fr); } .vr-setup dd { margin-bottom: 6px; } }
</style>
<div class="vr-shell" id="vr-shell">
  <div class="vr-card">
    <div class="eyebrow">Destiny 2 · Vault Rater</div>
    <h1>Rate your <span class="grad-text">vault</span></h1>
    <div id="vr-shell-body" class="stack"><p class="lede">Loading…</p></div>
    <ol class="vr-log" id="vr-log" aria-live="polite"></ol>
  </div>
</div>
<div class="vr-banner" id="vr-banner" role="alert" hidden></div>
